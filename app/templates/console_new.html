{% extends "base.html" %}

{% block title %}New Capture Link - Evidence Desk{% endblock %}

{% block content %}
<div class="card-panel form-card">
  <div style="margin-bottom: 24px;">
    <h1 style="font-size: 1.6rem; font-weight: 800; color: var(--ink); margin-bottom: 4px;">New Capture Link</h1>
    <p style="font-size: 0.88rem; color: var(--mute);">Enter policy and claimant details to generate a verified photo evidence link</p>
  </div>

  <form action="/console/new" method="post">
    <!-- Group 1: Claimant -->
    <div class="form-section-header">Claimant</div>

    <div class="form-grid-2">
      <div class="form-group">
        <label for="claimant_name">Claimant Name</label>
        <input type="text" id="claimant_name" name="claimant_name" class="form-control" placeholder="e.g. Jane Doe" required>
      </div>

      <div class="form-group">
        <label for="claimed_damage_area">Claimed Damage Area</label>
        <select id="claimed_damage_area" name="claimed_damage_area" class="form-control" required>
          <option value="">Select claimed area...</option>
          <option value="front">Front</option>
          <option value="rear">Rear</option>
          <option value="left side">Left side</option>
          <option value="right side">Right side</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label for="claimant_statement">Claimant Statement</label>
      <textarea id="claimant_statement" name="claimant_statement" class="form-control" rows="3" placeholder="e.g. I was rear-ended at a red light; rear bumper is crushed." required></textarea>
    </div>

    <!-- Group 2: Policy vehicle -->
    <div class="form-section-header">Policy vehicle</div>

    <div class="form-grid-2">
      <div class="form-group">
        <label for="make">Make</label>
        <input type="text" id="make" name="make" class="form-control" placeholder="e.g. Toyota" required>
      </div>
      <div class="form-group">
        <label for="model">Model</label>
        <input type="text" id="model" name="model" class="form-control" placeholder="e.g. Camry" required>
      </div>
    </div>

    <div class="form-grid-3">
      <div class="form-group">
        <label for="color">Color</label>
        <input type="text" id="color" name="color" class="form-control" placeholder="e.g. Blue" required>
      </div>
      <div class="form-group">
        <label for="plate">License Plate</label>
        <input type="text" id="plate" name="plate" class="form-control" placeholder="e.g. 7XYZ123" required>
      </div>
      <div class="form-group">
        <label for="state">State</label>
        <input type="text" id="state" name="state" class="form-control" placeholder="e.g. CA" maxlength="2" required>
      </div>
    </div>

    <div style="margin-top: 24px; display: flex; justify-content: flex-end; gap: 12px;">
      <a href="/console" class="btn-pill btn-pill-outline">Cancel</a>
      <button type="submit" class="btn-pill btn-pill-primary">Create claim & generate link</button>
    </div>
  </form>
</div>
{% endblock %}
