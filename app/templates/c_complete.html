<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Claim Sent - Demo Mutual Insurance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="capture-flow-body">

  <main class="flow-container">
    <div class="done-page-wrap">
      <div class="done-check-circle">✓</div>
      <h1 class="done-heading">Claim sent</h1>

      <div class="done-claim-card">
        <div class="done-claim-label">Claim number</div>
        <div class="done-claim-number">{{ claim.id if claim else session_code }}</div>
      </div>

      <p class="done-explainer-text">
        Demo Mutual Insurance has received claim {{ claim.id if claim else session_code }} with your photos and answers, sealed as they arrived. You can close this page.
      </p>
    </div>
  </main>

</body>
</html>
