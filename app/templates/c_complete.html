<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Submission Complete - Witnessed</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="capture-body" style="padding-top: 0;">

  <div class="capture-container" style="justify-content: center; text-align: center;">
    <div class="card" style="background: #1e293b; border-color: #334155; color: #ffffff; padding: 2rem 1.5rem;">
      <div style="font-size: 3rem; color: #4ade80; margin-bottom: 1rem;">&#10003;</div>
      <h1 style="color: #ffffff; font-size: 1.5rem; margin-bottom: 0.5rem;">Photos Submitted</h1>
      <p style="color: #94a3b8; font-size: 0.95rem; margin-bottom: 1.5rem;">
        Your photos have been cryptographically sealed and delivered to your insurance claims adjuster for review.
      </p>

      <div style="background: #0f172a; padding: 0.75rem; border-radius: 6px; font-family: monospace; font-size: 1rem; color: #cbd5e1; margin-bottom: 1.5rem;">
        Session: <strong>{{ session_code }}</strong>
      </div>

      <p style="font-size: 0.85rem; color: #64748b;">
        You may now safely close this window.
      </p>
    </div>
  </div>

</body>
</html>
