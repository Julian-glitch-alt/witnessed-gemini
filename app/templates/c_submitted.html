<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Session Submitted - Witnessed</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%232563eb'/%3E%3Cpath d='M12 20s6-3 6-7.5V6.5l-6-2.25-6 2.25v6c0 4.5 6 7.5 6 7.5z' fill='%23ffffff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="capture-body" style="padding-top: 0;">

  <div class="capture-container" style="justify-content: center; text-align: center;">
    <div class="card" style="background: #1e293b; border-color: #334155; color: #ffffff; padding: 2rem 1.5rem;">
      <div style="font-size: 2.5rem; color: #38bdf8; margin-bottom: 1rem;">&#128274;</div>
      <h1 style="color: #ffffff; font-size: 1.4rem; margin-bottom: 0.5rem;">Session Already Submitted</h1>
      <p style="color: #94a3b8; font-size: 0.95rem; margin-bottom: 1.5rem;">
        This capture session has already been submitted and sealed. No further photos can be uploaded.
      </p>

      <div style="background: #0f172a; padding: 0.75rem; border-radius: 6px; font-family: monospace; font-size: 1rem; color: #cbd5e1; margin-bottom: 1.5rem;">
        Session: <strong>{{ session_code }}</strong>
      </div>
    </div>
  </div>

</body>
</html>
